<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대시보드 레이아웃 검사</title>
<style>
  body{margin:0;background:#eef3f7;font:13px/1.45 -apple-system,'Apple SD Gothic Neo',sans-serif;color:#123}
  h1{font-size:16px;margin:10px 12px 4px}
  .row{display:flex;flex-wrap:wrap;gap:10px;padding:6px 12px}
  .box{background:#fff;border:1px solid #cbd8e2;border-radius:8px;padding:6px;position:relative}
  .box b{display:block;font-size:12px;margin:0 0 4px}
  iframe{border:1px solid #9fb3c4;display:block;background:#fff}
  pre{white-space:pre-wrap;margin:10px 12px 40px;background:#fff;border:1px solid #cbd8e2;border-radius:8px;padding:10px;font-size:12px}
</style>
</head>
<body>
<h1>정현이 대시보드 — 해상도별 레이아웃 검사</h1>
<div class="row" id="frames"></div>
<pre id="out">검사 중…</pre>
<script>
var SIZES = [[1280, 800], [1024, 768], [1366, 1024]];
var frames = document.getElementById('frames');
var out = document.getElementById('out');
var results = [];

function build() {
  SIZES.forEach(function (s) {
    var box = document.createElement('div');
    box.className = 'box';
    box.innerHTML = '<b>' + s[0] + '×' + s[1] + ' (아침)</b>';
    var f = document.createElement('iframe');
    f.width = s[0]; f.height = s[1];
    f.dataset.size = s.join('x');
    f.dataset.mode = 'morning';
    f.src = 'index.html?audit=' + s.join('x');
    box.appendChild(f);
    frames.appendChild(box);
  });
}

function audit(frame, mode) {
  var d = frame.contentDocument, w = frame.contentWindow;
  var vh = w.innerHeight, vw = w.innerWidth;
  var deck = d.getElementById('deck');
  var cards = [].slice.call(d.querySelectorAll('#deck .task'));
  var supplies = d.querySelector('.supplies');
  var cardInfo = cards.map(function (c) {
    var lb = c.querySelector('.lb');
    var cr = c.getBoundingClientRect(), lr = lb.getBoundingClientRect();
    var img = c.querySelector('.art img');
    var ir = img ? img.getBoundingClientRect() : null;
    return {
      text: lb.textContent,
      w: Math.round(cr.width), h: Math.round(cr.height),
      lbW: Math.round(lr.width), lbBottom: Math.round(lr.bottom), cardBottom: Math.round(cr.bottom),
      vclip: lr.bottom > cr.bottom - 1 || lr.top < cr.top,
      hclip: lb.scrollWidth > lb.clientWidth + 1,
      img: img ? (Math.round(ir.width) + 'x' + Math.round(ir.height)) : '-',
      imgOK: img ? (img.complete && img.naturalWidth > 0) : null
    };
  });
  var res = {
    mode: mode, vw: vw, vh: vh,
    cols: deck.dataset.cols,
    scrollH: Math.max(d.documentElement.scrollHeight, d.body.scrollHeight),
    scrollW: Math.max(d.documentElement.scrollWidth, d.body.scrollWidth),
    deckBottom: Math.round(deck.getBoundingClientRect().bottom),
    supBottom: Math.round(supplies.getBoundingClientRect().bottom),
    cards: cardInfo
  };
  res.fail = [];
  if (res.scrollH > vh + 1) res.fail.push('세로 스크롤 ' + (res.scrollH - vh) + 'px');
  if (res.scrollW > vw + 1) res.fail.push('가로 넘침 ' + (res.scrollW - vw) + 'px');
  if (res.supBottom > vh + 1) res.fail.push('하단 카드 ' + (res.supBottom - vh) + 'px 넘침');
  cardInfo.forEach(function (c) {
    if (c.vclip) res.fail.push('"' + c.text + '" 세로 잘림');
    if (c.hclip) res.fail.push('"' + c.text + '" 가로 잘림');
    if (c.imgOK === false) res.fail.push('"' + c.text + '" 그림 로드 실패');
  });
  return res;
}

function report(res) {
  var lines = ['[' + res.vw + '×' + res.vh + ' / ' + res.mode + '] 칸 ' + res.cols +
    ' · 스크롤H ' + res.scrollH + ' (뷰포트 ' + res.vh + ') · 스크롤W ' + res.scrollW +
    ' · 루틴바닥 ' + res.deckBottom + ' · 준비물바닥 ' + res.supBottom];
  res.cards.forEach(function (c) {
    lines.push('   - ' + c.text + ' | 카드 ' + c.w + '×' + c.h + ' | 라벨바닥 ' + c.lbBottom + '/' + c.cardBottom + ' | 그림 ' + c.img);
  });
  lines.push('   => ' + (res.fail.length ? 'FAIL: ' + res.fail.join(', ') : 'PASS'));
  return lines.join('\n');
}

function runAll() {
  var iframes = [].slice.call(document.querySelectorAll('iframe'));
  var i = 0;
  function next() {
    if (i >= iframes.length) {
      out.textContent = results.map(report).join('\n\n') +
        '\n\n==== 전체: ' + (results.every(function (r) { return !r.fail.length; }) ? 'PASS' : 'FAIL') + ' ====';
      window.__auditDone = true;
      document.title = 'AUDIT ' + (results.every(function (r) { return !r.fail.length; }) ? 'PASS' : 'FAIL');
      return;
    }
    var f = iframes[i++];
    try {
      var d = f.contentDocument;
      var ev = d.getElementById('modeEvening');
      ev.click();
      setTimeout(function () {
        var evening = audit(f, 'evening');
        results.push(evening);
        d.getElementById('modeMorning').click();
        setTimeout(function () {
          results.push(audit(f, 'morning'));
          next();
        }, 350);
      }, 450);
    } catch (e) {
      out.textContent += '\nframe error: ' + e.message;
      next();
    }
  }
  next();
}

build();
window.addEventListener('load', function () { setTimeout(runAll, 1500); });
</script>
</body>
</html>
